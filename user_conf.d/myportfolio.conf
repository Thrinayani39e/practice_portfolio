map $request_method $limit {
    default         "";
    POST            $binary_remote_addr;
}
limit_req_zone $limit zone=mylimit:10m rate=1r/m;
server {
    listen 80;
    server_name thrinayani-yedhoti.duckdns.org;

    if ($host = thrinayani-yedhoti.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name thrinayani-yedhoti.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }
    location /api/timeline_post {
        limit_req zone=mylimit;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }
    ssl_certificate /etc/letsencrypt/live/thrinayani-yedhoti.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thrinayani-yedhoti.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thrinayani-yedhoti.duckdns.org/chain.pem;
}
