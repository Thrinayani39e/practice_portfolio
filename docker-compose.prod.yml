version: '3'

services:
  myportfolio:
    build: .
    restart: always
    env_file:
      - .env
    # Notice that the ports section is completely gone from here!
    depends_on:
      - mysql

  mysql:
    image: mariadb:10.7
    restart: always
    env_file:
      - .env
    volumes:
      - mydatabase:/var/lib/mysql

  nginx:
    image: jonasal/nginx-certbot:latest
    restart: always
    environment:
      - CERTBOT_EMAIL=thrinayaniyedhoti@gmail.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./user_conf.d:/etc/nginx/user_conf.d
    depends_on:
      - myportfolio

volumes:
  mydatabase:
  nginx_secrets:
